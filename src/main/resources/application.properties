spring.application.name=apigateway
server.port=8080
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.cloud.gateway.server.mvc=TRACE
logging.level.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.root=INFO
logging.level.com.wilson.inkwell.apigateway.route.handler.CustomerProfileQueryHandler=DEBUG

# Resource server configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authorization-service:8081/.well-known/jwks.json

# Service network names for docker compose
network.authority.name.authorizationservice=authorization-service
network.authority.name.customerservice=customer-service

network.server.port.authorizationservice=8081
network.server.port.customerservice=8083